<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qualifier's table</title>

    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="Card">
      <div class="table-header">
        <h2>Latest Table</h2>
        <div class="arrow">
          <button>&lt;</button>
          <button>&gt;</button>
        </div>
      </div>
      <table>
        <thead>
          <th>#</th>
          <th>Team</th>
          <th>P</th>
          <th>GD</th>
          <th>PTS</th>
          <th>W</th>
        </thead>
        <tbody>
          <tr class="first">
            <td>1</td>
            <td class="Team">
              <img
                src="./images/south-africa-2024.png "
                alt="logo 1"
                class="logo"
              />
              <span style="color: white; font-weight: bolder"
                >South Africa</span
              >
            </td>
            <td>10</td>
            <td>6</td>
            <td class="points">18</td>
            <td class="W">5</td>
          </tr>

          <tr class="second">
            <td>2</td>
            <td class="Team">
              <img src="./images/nigeria-2024.png" alt="logo 2" class="logo" />
              <span style="color: white; font-weight: bolder"> Nigeria </span>
            </td>

            <td>10</td>
            <td>7</td>
            <td class="points">17</td>
            <td class="W">4</td>
          </tr>

          <tr class="third">
            <td>3</td>
            <td class="Team">
              <img src="./images/Benin.png" alt="logo 3" class="logo" />
              <span style="color: white; font-weight: bolder">Benin</span>
            </td>

            <td>10</td>
            <td>1</td>
            <td class="points">17</td>
            <td class="W">5</td>
          </tr>

          <tr class="fourth">
            <td>4</td>
            <td class="Team">
              <img src="./images/Lesotho.png" alt="logo 4" class="logo" />

              <span style="color: white; font-weight: bolder"> Lesotho</span>
            </td>
            <td>10</td>
            <td>-3</td>
            <td class="points">12</td>
            <td class="W">3</td>
          </tr>

          <tr class="fifth">
            <td>5</td>
            <td class="Team">
              <img src="./images/Rwanda.png" alt="logo 5" class="logo" />

              <span style="color: white; font-weight: bolder">Rwanda</span>
            </td>
            <td>10</td>
            <td>-4</td>
            <td class="points">11</td>
            <td class="W">3</td>
          </tr>

          <tr class="sixth">
            <td>6</td>
            <td class="Team">
              <img src="./images/Zimbabwe.png" alt="logo 6" class="logo" />

              <span style="color: white; font-weight: bolder"> Zimbabwe </span>
            </td>
            <td>10</td>
            <td>-7</td>
            <td class="points">5</td>
            <td class="W">0</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
